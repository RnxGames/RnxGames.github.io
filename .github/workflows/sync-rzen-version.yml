name: Sync R-Zen latest version

# Raises ios.latestVersion in rzen-update.json once a newer version is live on the App Store.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rzen-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the App Store
        id: sync
        run: bash scripts/sync-rzen-version.sh
      - name: Commit the new version
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rzen-update.json
          git commit -m "R-Zen ${{ steps.sync.outputs.version }} is live on the App Store"
          git push
